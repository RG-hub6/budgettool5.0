<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budnex</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/appwrite@20"></script>
</head>
<body>

<header>
  <button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span><span></span><span></span></button>
  <div class="titles">
    <img class="logo" alt="Budnex" src="logo.png">
    <div class="sub" id="pageLabel"></div>
  </div>
  <button class="gear-btn" id="gearBtn" aria-label="Settings"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
</header>

<div class="backdrop" id="backdrop"></div>

<nav class="sidebar" id="sidebar">
  <div class="side-head">
    <strong data-i="menu">Menu</strong>
    <button class="close" id="closeMenu" aria-label="Close">✕</button>
  </div>
  <div id="sideContent"></div>
</nav>

<nav class="sidebar" id="settingsBar">
  <div class="side-head">
    <strong class="hd"><svg viewBox="0 0 24 24" class="ico"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg> <span data-i="settings">Instellingen</span></strong>
    <button class="close" id="closeSettings" aria-label="Close">✕</button>
  </div>
  <div class="side-label" data-i="lang">Taal</div>
  <div id="langList"></div>
</nav>

<main>
<div class="warn" id="chartWarn"></div>

<!-- ============ PAGINA: MAAND ============ -->
<div id="pageMonth">
  <div class="panel">
    <h3><span data-i="ov"></span> <span id="monthName"></span></h3>
    <div class="cards">
      <div class="card"><small data-i="inc"></small><strong class="income">€<span id="mInc">0.00</span></strong></div>
      <div class="card"><small data-i="exp"></small><strong class="expense">€<span id="mExp">0.00</span></strong></div>
      <div class="card"><small data-i="sav"></small><strong class="saving">€<span id="mSav">0.00</span></strong></div>
      <div class="card"><small data-i="left"></small><strong id="mRest">€0.00</strong></div>
    </div>
    <p class="hint" data-i="fm"></p>
  </div>

  <div class="panel">
    <h3 data-i="cy"></h3>
    <label><input type="checkbox" id="showIncome" checked> <span data-i="inc"></span></label>
    <label><input type="checkbox" id="showExpense" checked> <span data-i="exp"></span></label>
    <label><input type="checkbox" id="showSaving" checked> <span data-i="sav"></span></label>
    <label><input type="checkbox" id="showRest" checked> <span data-i="leftS"></span></label>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h3 data-i="ep"></h3>
    <div class="pie-box"><canvas id="pieChart"></canvas></div>
    <p class="empty" id="pieEmpty" data-i="nem"></p>
  </div>

  <div class="panel">
    <h3 data-i="ip"></h3>
    <div class="pie-box"><canvas id="incPieChart"></canvas></div>
    <p class="empty" id="incPieEmpty" data-i="nim"></p>
  </div>

  <div class="panel">
    <h3 data-i="cats"></h3>
    <button onclick="addCategory()" data-i="nc"></button>
    <div id="categories"></div>
  </div>

  <div class="panel">
    <h3 data-i="ms"></h3>
    <p class="hint" data-i="rh"></p>
    <div class="row"><span data-i="ri"></span><span class="income">€<span id="recInc">0.00</span></span></div>
    <div class="row"><span data-i="re"></span><span class="expense">€<span id="recExp">0.00</span></span></div>
    <div class="row"><span data-i="sav"></span><span class="saving">€<span id="recSav">0.00</span></span></div>
    <div class="row total"><span data-i="sa"></span><span id="recBal">€0.00</span></div>
  </div>
</div>

<!-- ============ PAGINA: ALGEMEEN ============ -->
<div id="pageGeneral" style="display:none;">
  <div class="panel">
    <h3 id="ytdTitle"></h3>
    <div class="cards">
      <div class="card"><small data-i="earn"></small><strong class="income">€<span id="yInc">0.00</span></strong></div>
      <div class="card"><small data-i="spent"></small><strong class="expense">€<span id="yExp">0.00</span></strong></div>
      <div class="card"><small data-i="sav"></small><strong class="saving">€<span id="ySav">0.00</span></strong></div>
      <div class="card"><small data-i="left"></small><strong id="yRest">€0.00</strong></div>
    </div>
    <p class="hint" data-i="fy"></p>
    <h4 style="margin:14px 0 0 0;" data-i="avg"></h4>
    <div class="cards">
      <div class="card"><small data-i="ai"></small><strong class="income">€<span id="aInc">0.00</span></strong></div>
      <div class="card"><small data-i="ae"></small><strong class="expense">€<span id="aExp">0.00</span></strong></div>
      <div class="card"><small data-i="as"></small><strong class="saving">€<span id="aSav">0.00</span></strong></div>
    </div>
  </div>

  <div class="panel">
    <h3 data-i="rec"></h3>
    <label><span data-i="per"></span>
      <select id="genPeriod">
        <option value="week"></option>
        <option value="maand" selected></option>
        <option value="jaar"></option>
      </select>
    </label>
    <div class="row"><span data-i="inc"></span><span class="income">€<span id="gInc">0.00</span></span></div>
    <div class="row"><span data-i="exp"></span><span class="expense">€<span id="gExp">0.00</span></span></div>
    <div class="row"><span data-i="sav"></span><span class="saving">€<span id="gSav">0.00</span></span></div>
    <div class="row total"><span data-i="sa"></span><span id="gBal">€0.00</span></div>
  </div>

  <div class="panel">
    <h3 data-i="cr"></h3>
    <canvas id="genBar"></canvas>
  </div>

  <div class="panel">
    <h3 data-i="wt"></h3>
    <p class="hint" data-i="wh"></p>
    <div class="pie-box"><canvas id="genPieSaldo"></canvas></div>
    <p class="empty" id="genPieSaldoEmpty" data-i="nb"></p>
  </div>

  <div class="panel">
    <h3 data-i="wi"></h3>
    <div class="pie-box"><canvas id="genPieInc"></canvas></div>
    <p class="empty" id="genPieIncEmpty" data-i="ni"></p>
  </div>

  <div class="panel">
    <h3 data-i="ic"></h3>
    <div class="pie-box"><canvas id="genPieIncCat"></canvas></div>
    <p class="empty" id="genPieIncCatEmpty" data-i="ni"></p>
  </div>

  <div class="panel">
    <h3 data-i="wc"></h3>
    <div class="pie-box"><canvas id="genPieExp"></canvas></div>
    <p class="empty" id="genPieExpEmpty" data-i="ne"></p>
  </div>

  <div class="panel">
    <h3 data-i="lr"></h3>
    <button onclick="addCategory()" data-i="nc"></button>
    <div id="genCategories"></div>
  </div>
</div>

<!-- ============ PAGINA: BUDGETTEN ============ -->
<div id="pageBudget" style="display:none;">
  <div class="panel">
    <h3 id="budTitle"></h3>
    <label><span data-i="bPeriod"></span> <select id="budPeriod"></select></label>
    <div class="cards">
      <div class="card"><small data-i="bBudget"></small><strong>€<span id="bdBudget">0.00</span></strong></div>
      <div class="card"><small data-i="spent"></small><strong class="expense">€<span id="bdSpent">0.00</span></strong></div>
      <div class="card"><small data-i="bBal"></small><strong id="bdBal">€0.00</strong></div>
      <div class="card"><small data-i="bTotOver"></small><strong id="bdOver">€0.00</strong></div>
    </div>
    <p class="hint" data-i="bHint"></p>
  </div>

  <div class="panel">
    <h3 data-i="bPie"></h3>
    <div class="pie-box"><canvas id="budPie"></canvas></div>
    <p class="empty" id="budPieEmpty" data-i="bPieE"></p>
  </div>

  <div class="panel">
    <h3 data-i="bList"></h3>
    <button onclick="addBudget()" data-i="bNew"></button>
    <div id="budList"></div>
  </div>
</div>
</main>

<script src="talen.js"></script>
<script src="script.js"></script>
<script src="appwrite-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
